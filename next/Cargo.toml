[package]
name = "cad-next"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "Persistent Rust host for the local FreeCAD modeling worker"
default-run = "cad-next"

[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
eframe = { version = "0.33", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"], optional = true }
glam = { version = "0.30", optional = true }
bytemuck = { version = "1", optional = true }
egui-file-dialog = { version = "=0.12.0", default-features = false, optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
desktop = ["dep:eframe", "dep:glam", "dep:bytemuck", "dep:egui-file-dialog"]

[[bin]]
name = "cad-next-editor"
path = "src/bin/editor.rs"
required-features = ["desktop"]

[[bin]]
name = "cad-next-packages"
path = "src/bin/packages.rs"

[[bin]]
name = "cad-next-sketch"
path = "src/bin/sketch_commands.rs"
