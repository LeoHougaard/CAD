name: Native FreeCAD migration

on:
  push:
    paths: ['next/**', '.github/workflows/next.yml']
  pull_request:
    paths: ['next/**', '.github/workflows/next.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-next-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_BUILD_JOBS: 2
  RUSTUP_TOOLCHAIN: 1.99.1

jobs:
  native:
    name: Native documents / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Workflow evidence resolves its pinned source commit.
      - name: Linux runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libegl1 libglu1-mesa libxkbcommon-dev libwayland-dev g++ binutils
      - name: Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component clippy --component rustfmt
      - name: Cache pinned runtime
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools/freecad-runtime
          key: native-freecad-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('next/runtime.json') }}
      - name: Rust checks
        run: |
          cargo fmt --manifest-path next/Cargo.toml -- --check
          cargo clippy --manifest-path next/Cargo.toml --all-features --all-targets --locked -- -D warnings
          cargo test --manifest-path next/Cargo.toml --all-features --locked
          cargo build --manifest-path next/Cargo.toml --all-features --bins --locked
          python -B next/tests/session_callback_tests.py
          python -B next/tests/runtime_argument_tests.py
          python -B next/tools/validate_workflows.py
          python -B next/tests/workflow_ledger_tests.py
      - name: Verified native runtime
        run: python next/tools/setup_runtime.py --output next/target/runtime.json
      - name: Linux x64 native checkpoint promotion gate
        if: runner.os == 'Linux'
        env:
          FREECAD_USER_HOME: ${{ github.workspace }}/next/target/checkpoint-linux-x64-config
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          test "$RUNNER_ARCH" = X64
          mkdir -p "$FREECAD_USER_HOME"
          python -B next/tools/check_checkpoint_linux.py --runtime next/target/runtime.json --host next/target/debug/cad-next --expected-arch x86_64 --output next/target/checkpoint-linux-x64
      - name: Windows native checkpoint regression gate
        if: runner.os == 'Windows'
        env:
          FREECAD_USER_HOME: ${{ github.workspace }}/next/target/checkpoint-windows-config
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          mkdir -p "$FREECAD_USER_HOME"
          python -B next/tests/checkpoint_restore_workflows.py --runtime next/target/runtime.json --host next/target/debug/cad-next.exe --output next/target/checkpoint-windows
          python -B next/tests/checkpoint_linux_workflows.py --runtime next/target/runtime.json --host next/target/debug/cad-next.exe --output next/target/checkpoint-windows-public
      - name: Native document ownership and Editor save-path regressions
        env:
          CAD_LIFECYCLE_RUNTIME: ${{ github.workspace }}/next/target/runtime.json
          CAD_LIFECYCLE_OUTPUT: ${{ github.workspace }}/next/target/document-ownership/editor
          FREECAD_USER_HOME: ${{ github.workspace }}/next/target/document-ownership-config
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          host=next/target/debug/cad-next
          compiler=next/target/debug/cad-next-packages
          if [ "$RUNNER_OS" = Windows ]; then host="$host.exe"; compiler="$compiler.exe"; fi
          python -B next/tools/check_document_ownership.py --runtime next/target/runtime.json --host "$host" --compiler "$compiler" --output next/target/document-ownership
          mkdir -p "$CAD_LIFECYCLE_OUTPUT"
          for case in document_switch_preserves_dirty_confirmation_and_each_save_path ordinary_failed_open_keeps_dirty_content_and_save_retry_path; do
            cargo test --manifest-path next/Cargo.toml --all-features --locked "editor::sketch::lifecycle_tests::$case" -- --exact --ignored --test-threads=1 > "next/target/document-ownership/$case.log" 2>&1
          done
      - name: Record checkpoint gate provenance
        if: always()
        run: |
          python -B - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          root = pathlib.Path.cwd()
          files = [root/'.github/workflows/next.yml', root/'next/target/runtime.json']
          for pattern in ['next/src/**/*.rs', 'next/backend/**/*.py', 'next/backend/native/*', 'next/tools/*.py', 'next/tests/checkpoint*', 'next/tests/fixtures/checkpoint*', 'next/tests/document_ownership*', 'next/tests/fixtures/document_ownership*']:
              files.extend(path for path in root.glob(pattern) if path.is_file())
          files.extend(root/'next/target/debug'/name for name in ['cad-next', 'cad-next.exe', 'cad-next-packages', 'cad-next-packages.exe'])
          hashes = {str(path.relative_to(root)): hashlib.sha256(path.read_bytes()).hexdigest() for path in files if path.is_file()}
          target = root/'next/target/checkpoint-gate-provenance.json'
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(json.dumps({'head': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(), 'run_id': os.environ.get('GITHUB_RUN_ID'), 'os': os.environ.get('RUNNER_OS'), 'architecture': os.environ.get('RUNNER_ARCH'), 'files': hashes}, indent=2) + '\n')
          PY
      - name: Preserve checkpoint gate evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checkpoint-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: |
            next/target/checkpoint-gate-provenance.json
            next/target/runtime.json
            next/target/checkpoint-linux-x64/
            next/target/checkpoint-windows/
            next/target/checkpoint-windows-public/
            next/target/document-ownership/
            next/backend/native/checkpoint_restore*.json
            next/backend/native/checkpoint_restore*.so
            next/backend/native/checkpoint_restore.dll
      - name: Native sketch editing, attachment, fillets, Bodies and history
        run: |
          host=next/target/debug/cad-next
          if [ "$RUNNER_OS" = Windows ]; then host="$host.exe"; fi
          python next/tests/native_workflows.py --host "$host" --runtime next/target/runtime.json --output next/target/native-documents
          python next/tests/preview_workflows.py --host "$host" --runtime next/target/runtime.json --output next/target/preview-documents
          compiler=next/target/debug/cad-next-packages
          if [ "$RUNNER_OS" = Windows ]; then compiler="$compiler.exe"; fi
          python next/tests/package_workflows.py --host "$host" --compiler "$compiler" --runtime next/target/runtime.json --output next/target/package-documents
          sketch_compiler=next/target/debug/cad-next-sketch
          if [ "$RUNNER_OS" = Windows ]; then sketch_compiler="$sketch_compiler.exe"; fi
          python next/tests/sketch_commands_workflows.py --host "$host" --compiler "$sketch_compiler" --runtime next/target/runtime.json --output next/target/sketch-command-documents
          python next/tests/sketch_editor_workflows.py --host "$host" --runtime next/target/runtime.json --output next/target/sketch-editor-documents
          python next/tests/revision_workflows.py --host "$host" --runtime next/target/runtime.json --output next/target/revision-documents
          python next/tests/session_lifecycle_workflows.py --host "$host" --runtime next/target/runtime.json --output next/target/session-lifecycle-documents
          python next/tests/preview_facts_workflows.py --host "$host" --runtime next/target/runtime.json --output next/target/preview-facts-documents
          python next/tests/body_workflows.py --host "$host" --compiler "$compiler" --runtime next/target/runtime.json --output next/target/body-documents
          python next/tests/history_workflows.py --host "$host" --compiler "$compiler" --runtime next/target/runtime.json --output next/target/history-documents
          python next/tests/sketch_creation_workflows.py --host "$host" --compiler "$compiler" --runtime next/target/runtime.json --output next/target/sketch-creation-documents
          python -B next/tests/sketch_attachment_workflows.py --host "$host" --compiler "$compiler" --runtime next/target/runtime.json --output next/target/sketch-attachment-documents
          python -B next/tests/assembly_workflows.py --host "$host" --compiler "$compiler" --runtime next/target/runtime.json --output next/target/assembly-documents
          python -B next/tests/assembly_loading_workflows.py --host "$host" --runtime next/target/runtime.json --output next/target/assembly-loading-documents
          python -B next/tests/proxy_restore_workflows.py --host "$host" --runtime next/target/runtime.json --output next/target/proxy-restore-documents
          python -B next/tests/measurement_workflows.py --host "$host" --runtime next/target/runtime.json --output next/target/measurement-documents
          python next/tests/profile_reference_workflows.py --host "$host" --compiler "$compiler" --runtime next/target/runtime.json --output next/target/profile-reference-documents
          python next/tests/profile_materialization_workflows.py --host "$host" --compiler "$compiler" --runtime next/target/runtime.json --output next/target/profile-materialization-documents
          python next/tests/common_dimension_workflows.py --host "$host" --compiler "$sketch_compiler" --runtime next/target/runtime.json --output next/target/common-dimension-documents
          python next/tests/refraction_workflows.py --host "$host" --compiler "$sketch_compiler" --runtime next/target/runtime.json --output next/target/refraction-documents
          python next/tests/refraction_compatibility_workflows.py --host "$host" --compiler "$sketch_compiler" --runtime next/target/runtime.json --output next/target/refraction-compatibility-documents
          python next/tests/via_point_workflows.py --host "$host" --compiler "$sketch_compiler" --runtime next/target/runtime.json --output next/target/via-point-documents
          python next/tests/angle_via_point_workflows.py --host "$host" --compiler "$sketch_compiler" --runtime next/target/runtime.json --output next/target/angle-via-point-documents
          python next/tests/angle_selection_workflows.py --host "$host" --compiler "$sketch_compiler" --runtime next/target/runtime.json --output next/target/angle-selection-documents
          python next/tests/dimension_dialog_workflows.py --host "$host" --compiler "$sketch_compiler" --runtime next/target/runtime.json --output next/target/dimension-dialog-documents
          python next/tests/projected_point_workflows.py --host "$host" --compiler "$sketch_compiler" --runtime next/target/runtime.json --output next/target/projected-point-documents
          python next/tests/internal_point_copy_workflows.py --host "$host" --runtime next/target/runtime.json --output next/target/internal-point-copy-documents
          python next/tests/feature_workflows.py --host "$host" --compiler "$compiler" --runtime next/target/runtime.json --output next/target/feature-documents
          python next/tests/extrusion_termination_workflows.py --host "$host" --compiler "$compiler" --runtime next/target/runtime.json --output next/target/extrusion-termination-documents
          python next/tests/extrusion_whole_object_workflows.py --host "$host" --compiler "$compiler" --runtime next/target/runtime.json --output next/target/extrusion-whole-object-documents
          python next/tests/extrusion_task_retention_workflows.py --host "$host" --compiler "$compiler" --runtime next/target/runtime.json --output next/target/extrusion-task-retention-documents
          python next/tests/extrusion_expression_workflows.py --host "$host" --compiler "$compiler" --runtime next/target/runtime.json --output next/target/extrusion-expression-documents
          python next/tests/sketch_curves_workflows.py --host "$host" --compiler "$sketch_compiler" --runtime next/target/runtime.json --output next/target/sketch-curve-documents
          python next/tests/sketch_operations_workflows.py --host "$host" --compiler "$sketch_compiler" --runtime next/target/runtime.json --output next/target/sketch-operation-documents
          python next/tests/transform_workflows.py --host "$host" --compiler "$compiler" --runtime next/target/runtime.json --output next/target/transform-documents
          python next/tests/exchange_workflows.py --host "$host" --runtime next/target/runtime.json --output next/target/exchange-documents
      - name: Native extrusion editor controls through headless egui
        env:
          CAD_EDITOR_ACCEPTANCE_RUNTIME: ${{ github.workspace }}/next/target/runtime.json
          CAD_EDITOR_ACCEPTANCE_FIXTURES: ${{ github.workspace }}/next/target/extrusion-termination-documents/inputs/fixtures.json
          CAD_EDITOR_ACCEPTANCE_OUTPUT: ${{ github.workspace }}/next/target/extrusion-editor-documents
          FREECAD_USER_HOME: ${{ github.workspace }}/next/target/extrusion-editor-config
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          mkdir -p "$CAD_EDITOR_ACCEPTANCE_OUTPUT" "$FREECAD_USER_HOME"
          cargo test --manifest-path next/Cargo.toml --all-features --locked extrusion_editor_ -- --ignored --test-threads=1
      - name: Native editor unsaved-change and unavailable-document recovery
        env:
          CAD_LIFECYCLE_RUNTIME: ${{ github.workspace }}/next/target/runtime.json
          CAD_LIFECYCLE_OUTPUT: ${{ github.workspace }}/next/target/lifecycle-editor-documents
          FREECAD_USER_HOME: ${{ github.workspace }}/next/target/lifecycle-editor-config
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          mkdir -p "$CAD_LIFECYCLE_OUTPUT" "$FREECAD_USER_HOME"
          skip=(--skip mirror_editor_unavailable_constraints_preserves_default_and_redo --skip document_switch_preserves_dirty_confirmation_and_each_save_path --skip ordinary_failed_open_keeps_dirty_content_and_save_retry_path)
          if [ "$RUNNER_OS" != Windows ]; then
            skip+=(--skip mirror_editor_apply_cancel_action_history_and_reopen --skip mirror_editor_invalid_selection_native_failure_and_session_cancel --skip mirror_editor_accepted_native_ids_survive_later_tasks_and_history)
          fi
          cargo test --manifest-path next/Cargo.toml --all-features --locked editor::sketch::lifecycle_tests:: -- --ignored --test-threads=1 "${skip[@]}"
      - name: Windows editor unavailable Mirror mode preserves default and Redo
        if: runner.os == 'Windows'
        env:
          CAD_LIFECYCLE_OUTPUT: ${{ github.workspace }}/next/target/mirror-unavailable-editor-documents
          FREECAD_USER_HOME: ${{ github.workspace }}/next/target/mirror-unavailable-editor-config
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          mkdir -p "$CAD_LIFECYCLE_OUTPUT" "$FREECAD_USER_HOME"
          python -B - <<'PY'
          import json, pathlib, shutil
          root = pathlib.Path.cwd()
          target = root/'next/target/mirror-unavailable-source'
          shutil.copytree(root/'next/backend', target/'backend', ignore=shutil.ignore_patterns('sketch_mirror.dll'))
          shutil.copytree(root/'next/tests/fixtures', target/'tests/fixtures')
          runtime = json.loads((root/'next/target/runtime.json').read_text())
          runtime['test_worker'] = str(target/'tests/fixtures/lifecycle_fault_worker.py')
          (root/'next/target/mirror-unavailable-runtime.json').write_text(json.dumps(runtime))
          PY
          CAD_LIFECYCLE_RUNTIME="$GITHUB_WORKSPACE/next/target/mirror-unavailable-runtime.json" cargo test --manifest-path next/Cargo.toml --all-features --locked mirror_editor_unavailable_constraints_preserves_default_and_redo -- --ignored --test-threads=1
      - name: Native assembly, measurement, attachment and reference editor workflows
        env:
          FREECAD_USER_HOME: ${{ github.workspace }}/next/target/parity-editor-config
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          cargo test --manifest-path next/Cargo.toml --all-features --locked --no-run --message-format=json > next/target/editor-test-artifacts.jsonl
          python -B - <<'PY'
          import json, os, pathlib, subprocess, sys
          root = pathlib.Path.cwd()
          artifacts = [json.loads(line) for line in (root/'next/target/editor-test-artifacts.jsonl').read_text().splitlines() if line.startswith('{')]
          binary = next(a['executable'] for a in artifacts if a.get('reason') == 'compiler-artifact' and a.get('executable') and 'lib' in a['target']['kind'] and a['profile']['test'])
          out = root/'next/target/parity-editor-documents'
          out.mkdir()
          runtime = str(root/'next/target/runtime.json')
          for case in ['native_assembly_authoring', 'native_joint_override_opt_out']:
              env = dict(os.environ, CAD_ASSEMBLY_RUNTIME=runtime, CAD_ASSEMBLY_OUTPUT=str(out/case))
              subprocess.run([binary, 'editor::assembly::tests::'+case, '--exact', '--ignored', '--test-threads=1'], env=env, check=True)
          (out/'attachment').mkdir()
          env = dict(os.environ, CAD_SKETCH_ATTACHMENT_RUNTIME=runtime, CAD_SKETCH_ATTACHMENT_OUTPUT=str(out/'attachment'))
          subprocess.run([binary, 'editor::sketch_creation::native_tests::', '--ignored', '--test-threads=1'], env=env, check=True)
          env = dict(os.environ, CAD_MEASUREMENT_RUNTIME=runtime, CAD_MEASUREMENT_OUTPUT=str(out/'measurement'))
          subprocess.run([binary, 'editor::measurements::tests::', '--ignored', '--skip', 'scene_tests::', '--test-threads=1'], env=env, check=True)
          host = root/'next/target/debug'/('cad-next.exe' if os.name == 'nt' else 'cad-next')
          subprocess.run([sys.executable, '-B', 'next/tests/measurement_scene_workflows.py', '--host', str(host), '--runtime', runtime, '--editor-tests', binary, '--output', str(out/'link-scene')], check=True)
          subprocess.run([sys.executable, '-B', 'next/tests/reference_selection_workflows.py', '--runtime', runtime, '--tests', binary, '--output', str(out/'reference-selection')], check=True)
          PY
